<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cermaq Media Watch — Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --aqua: #0096a0;
      --aqua-light: #e8f5f6;
      --deep-blue: #324664;
      --bg-page: #f5f4ef;
      --border: #e5e7eb;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background: var(--bg-page); color: #111827; }

    .app-outer { min-height: 100vh; display: flex; justify-content: center; background: var(--bg-page); }
    .app-container { width: 100%; max-width: 1440px; display: flex; min-height: 100vh; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); }

    .sidebar {
      width: 240px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 100;
    }
    .sidebar-logo { padding: 20px 20px 18px; border-bottom: 1px solid var(--border); }
    .sidebar-logo .brand-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); font-weight: 500; }
    .sidebar-logo .brand-name { font-size: 16px; font-weight: 600; color: var(--deep-blue); margin-top: 3px; }
    .sidebar-logo .brand-name span { color: var(--aqua); }
    .sidebar-pillar { padding: 16px 20px 4px; }
    .sidebar-pillar-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); }
    .sidebar-group { padding: 8px 0 2px; }
    .sidebar-group-label { padding: 0 20px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #b0b8c4; }
    .sidebar-divider { height: 1px; background: var(--border); margin: 6px 20px; }
    .nav-item {
      display: flex; align-items: center; gap: 9px; padding: 7px 20px; font-size: 13px; color: var(--text-secondary);
      text-decoration: none; border-left: 3px solid transparent; transition: background 0.1s, color 0.1s;
    }
    .nav-item:hover { background: #f9fafb; color: #111827; }
    .nav-item.active { background: var(--aqua-light); color: var(--aqua); border-left-color: var(--aqua); font-weight: 500; }
    .nav-item svg { flex-shrink: 0; opacity: 0.6; }

    .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 14px; font-weight: 500; color: #374151; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--deep-blue); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

    .content-area { padding: 40px 24px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .coming-soon {
      text-align: center;
      max-width: 400px;
    }
    .coming-soon-icon {
      width: 64px; height: 64px;
      background: var(--aqua-light);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      color: var(--aqua);
    }
    .coming-soon h2 { font-size: 22px; font-weight: 600; color: var(--deep-blue); margin-bottom: 10px; }
    .coming-soon p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 24px; color: var(--aqua); font-size: 13px; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="app-outer">
<div class="app-container">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand-eyebrow">Cermaq</div>
      <div class="brand-name">Media <span>Watch</span></div>
    </div>
    <div class="sidebar-pillar">
      <div class="sidebar-pillar-label">News Watch</div>
    </div>
    <a href="/?lang={{ lang }}" class="nav-item">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      Alle nyheter
    </a>
    <div class="sidebar-divider"></div>
    <div class="sidebar-group">
      <div class="sidebar-group-label">Innsikt</div>
      <a href="/uken?lang={{ lang }}" class="nav-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Uken oppsummert
      </a>
      <a href="/analytics?lang={{ lang }}" class="nav-item active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Analytics
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-pillar" style="padding-top:12px;">
      <div class="sidebar-pillar-label">Finance Watch</div>
    </div>
    <a href="/finance?lang={{ lang }}" class="nav-item">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
      </svg>
      Finans &amp; Marked
    </a>
    <a href="/alerts?lang={{ lang }}" class="nav-item">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      Varsling
    </a>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Analytics</span>
      <div class="avatar">HM</div>
    </header>

    <div class="content-area">
      <div class="coming-soon">
        <div class="coming-soon-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <h2>Analytics — kommer snart</h2>
        <p>Dybdeanalyse av mediedekning, trender over tid, kildefordeling og tema-statistikk er under utvikling.</p>
        <a href="/?lang={{ lang }}" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Tilbake til nyheter
        </a>
      </div>
    </div>
  </div>
</div>
</div>
</body>
</html>
