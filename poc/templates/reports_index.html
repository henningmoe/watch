<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cermaq Media Watch — Rapporter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --aqua: #0096a0;
      --aqua-light: #e8f5f6;
      --deep-blue: #324664;
      --bg-page: #f5f4ef;
      --border: #e5e7eb;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --green: #059669;
      --red: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background: var(--bg-page); color: #111827; }

    .app-outer { min-height: 100vh; display: flex; justify-content: center; background: var(--bg-page); }
    .app-container { width: 100%; max-width: 1440px; display: flex; min-height: 100vh; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); }

    /* Sidebar */
    .sidebar { width: 240px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 100; }
    .sidebar-logo { padding: 20px 20px 18px; border-bottom: 1px solid var(--border); }
    .sidebar-logo .brand-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); font-weight: 500; }
    .sidebar-logo .brand-name { font-size: 16px; font-weight: 600; color: var(--deep-blue); margin-top: 3px; }
    .sidebar-logo .brand-name span { color: var(--aqua); }
    .sidebar-pillar { padding: 16px 20px 4px; }
    .sidebar-pillar-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); }
    .sidebar-group { padding: 8px 0 2px; }
    .sidebar-group-label { padding: 0 20px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #b0b8c4; }
    .sidebar-divider { height: 1px; background: var(--border); margin: 6px 20px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 20px; font-size: 13px; color: var(--text-secondary); text-decoration: none; border-left: 3px solid transparent; transition: background 0.1s, color 0.1s; }
    .nav-item:hover { background: #f9fafb; color: #111827; }
    .nav-item.active { background: var(--aqua-light); color: var(--aqua); border-left-color: var(--aqua); font-weight: 500; }
    .nav-item svg { flex-shrink: 0; opacity: 0.6; }
    .sidebar-count { margin-left: auto; font-size: 10px; color: var(--text-muted); background: #f3f4f6; padding: 1px 6px; border-radius: 10px; }
    .lang-switcher { display: flex; gap: 4px; padding: 12px 20px; border-top: 1px solid var(--border); margin-top: auto; flex-wrap: wrap; }
    .lang-btn { font-size: 11px; padding: 3px 8px; border-radius: 4px; text-decoration: none; color: var(--text-secondary); border: 1px solid var(--border); }
    .lang-btn.active { background: var(--aqua); color: #fff; border-color: var(--aqua); }

    /* Main */
    .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-title { font-size: 14px; font-weight: 500; color: #374151; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--deep-blue); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .content-area { padding: 28px 24px; flex: 1; }

    /* Page header */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: var(--deep-blue); margin-bottom: 4px; }
    .page-header p { font-size: 13px; color: var(--text-muted); }

    /* Actions bar */
    .reports-actions { margin-bottom: 24px; }

    /* Buttons */
    .primary-btn { background: var(--aqua); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .primary-btn:hover { background: #007882; }
    .primary-btn:disabled { background: #9ca3af; cursor: wait; }
    .secondary-btn { background: #fff; color: var(--deep-blue); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .secondary-btn:hover { background: #f9fafb; }

    /* Reports list */
    .reports-list { display: flex; flex-direction: column; gap: 10px; }
    .report-card { padding: 16px 20px; background: #fff; border: 1px solid var(--border); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.15s; text-decoration: none; color: inherit; }
    .report-card:hover { border-color: var(--aqua); background: #fafaf7; box-shadow: 0 2px 8px rgba(0,150,160,0.08); }
    .report-card-info { flex: 1; }
    .report-card-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .report-card-type.weekly { background: #cfe7ee; color: #1f5d6e; }
    .report-card-type.monthly { background: #324664; color: #fff; }
    .report-card-type.custom { background: #e8e3f4; color: #4a3d7a; }
    .report-card-title { font-size: 15px; font-weight: 600; color: var(--deep-blue); margin-bottom: 4px; }
    .report-card-meta { font-size: 12px; color: var(--text-muted); }
    .report-card-arrow { color: var(--text-muted); font-size: 18px; margin-left: 16px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state p { font-size: 14px; margin-bottom: 20px; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; color: var(--deep-blue); margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 0 4px; line-height: 1; }
    .modal-close:hover { color: #111827; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #555; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--aqua); }
    .form-hint { font-size: 11px; color: var(--text-muted); margin: 4px 0 0 0; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .generator-status { margin-top: 12px; font-size: 13px; color: var(--text-secondary); text-align: center; min-height: 20px; }
    .generator-status.error { color: var(--red); }

    @media (max-width: 768px) { .main-content { width: 100%; } }
  </style>
  <script>
  window.translations = {{ translations | tojson | safe }};
  window.lang = '{{ lang }}';
  window.t = function(key, vars) {
    var s = (window.translations && window.translations[key]) || key;
    if (vars) { for (var k in vars) { s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]); } }
    return s;
  };
  </script>
</head>
<body>
<div class="app-outer">
<div class="app-container">

  {% include '_sidebar.html' %}

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Rapporter</span>
      <div class="topbar-right">
        <div class="avatar">HM</div>
      </div>
    </header>

    <div class="content-area">
      <div class="page-header">
        <h1>Rapporter</h1>
        <p>Genererte medieovervåknings-rapporter for utvalgte perioder</p>
      </div>

      <div class="reports-actions">
        <button class="primary-btn" id="open-generator">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Generer ny rapport
        </button>
      </div>

      <div class="reports-list" id="reports-list">
        <div style="color:var(--text-muted);font-size:13px;">Laster rapporter...</div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Generator modal -->
<div class="modal-overlay" id="generator-modal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h2>Generer ny rapport</h2>
      <button class="modal-close" id="cancel-generator">&times;</button>
    </div>

    <div class="form-group">
      <label>Periode</label>
      <select id="period-preset">
        <option value="last7">Siste 7 dager</option>
        <option value="last14">Siste 14 dager</option>
        <option value="last30">Siste 30 dager</option>
        <option value="this_week">Denne uken</option>
        <option value="last_week">Forrige uke</option>
        <option value="this_month">Denne måneden</option>
        <option value="last_month">Forrige måned</option>
        <option value="custom">Egendefinert</option>
      </select>
    </div>

    <div class="form-group" id="custom-dates" style="display:none;">
      <label>Fra dato</label>
      <input type="date" id="period-start" style="margin-bottom:8px;">
      <label>Til dato</label>
      <input type="date" id="period-end">
    </div>

    <div class="form-group">
      <label>Fokus</label>
      <select id="focus">
        <option value="all">Alle (Cermaq + bransje)</option>
        <option value="cermaq">Kun Cermaq-omtaler</option>
        <option value="industry">Kun bransje-stoff</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tema-filter <span style="font-weight:400;text-transform:none;letter-spacing:0;">(valgfri)</span></label>
      <select id="theme-filter" multiple style="height:110px;">
        <option value="Sjø">Sjø</option>
        <option value="Landbasert">Landbasert</option>
        <option value="Fôr">Fôr</option>
        <option value="Fiskehelse">Fiskehelse</option>
        <option value="Teknologi">Teknologi</option>
        <option value="Digitalisering">Digitalisering</option>
        <option value="Finans">Finans</option>
        <option value="Marked">Marked</option>
      </select>
      <p class="form-hint">Hold Ctrl / Cmd for å velge flere tema</p>
    </div>

    <div class="form-group">
      <label>Tittel <span style="font-weight:400;text-transform:none;letter-spacing:0;">(valgfri)</span></label>
      <input type="text" id="report-title" placeholder="Auto-genereres hvis tomt">
    </div>

    <div class="modal-actions">
      <button class="secondary-btn" id="cancel-generator2">Avbryt</button>
      <button class="primary-btn" id="submit-generator">Generer rapport</button>
    </div>
    <div class="generator-status" id="generator-status"></div>
  </div>
</div>

<script>
const LANG = '{{ lang }}';

const TYPE_LABELS = { weekly: 'Ukerapport', monthly: 'Månedsrapport', custom: 'Ad-hoc' };

function relativeDate(iso) {
  const dt = new Date(iso);
  const today = new Date();
  today.setHours(0,0,0,0);
  const day = new Date(dt);
  day.setHours(0,0,0,0);
  const diff = Math.round((today - day) / 86400000);
  if (diff === 0) return 'i dag';
  if (diff === 1) return 'i går';
  if (diff < 7) return `${diff} dager siden`;
  const mo = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
  return `${dt.getDate()}. ${mo[dt.getMonth()]}`;
}

async function loadReports() {
  try {
    const r = await fetch(`/api/reports?lang=${LANG}&limit=50`);
    const data = await r.json();
    const reports = data.reports || [];

    if (!reports.length) {
      document.getElementById('reports-list').innerHTML = `
        <div class="empty-state">
          <p>Ingen rapporter generert ennå.</p>
          <button class="primary-btn" onclick="openModal()">Generer første rapport</button>
        </div>`;
      return;
    }

    document.getElementById('reports-list').innerHTML = reports.map(rep => {
      const start = new Date(rep.period_start).toLocaleDateString('no-NO');
      const end = new Date(rep.period_end).toLocaleDateString('no-NO');
      const typeClass = rep.type || 'custom';
      return `
        <a class="report-card" href="/reports/${rep.id}?lang=${LANG}">
          <div class="report-card-info">
            <span class="report-card-type ${typeClass}">${TYPE_LABELS[rep.type] || rep.type}</span>
            <div class="report-card-title">${rep.title}</div>
            <div class="report-card-meta">${start} – ${end} &nbsp;·&nbsp; ${rep.article_count} artikler &nbsp;·&nbsp; Generert ${relativeDate(rep.generated_at)}</div>
          </div>
          <span class="report-card-arrow">›</span>
        </a>`;
    }).join('');
  } catch (e) {
    document.getElementById('reports-list').innerHTML =
      '<div style="color:var(--red);font-size:13px;">Feil ved lasting av rapporter.</div>';
  }
}

function openModal() {
  document.getElementById('generator-modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('generator-modal').style.display = 'none';
  document.getElementById('generator-status').textContent = '';
  document.getElementById('generator-status').className = 'generator-status';
  document.getElementById('submit-generator').disabled = false;
}

document.getElementById('open-generator').addEventListener('click', openModal);
document.getElementById('cancel-generator').addEventListener('click', closeModal);
document.getElementById('cancel-generator2').addEventListener('click', closeModal);

document.getElementById('period-preset').addEventListener('change', e => {
  document.getElementById('custom-dates').style.display =
    e.target.value === 'custom' ? 'block' : 'none';
});

function getPeriodDates() {
  const preset = document.getElementById('period-preset').value;
  const now = new Date();
  let start, end;

  if (preset === 'last7') {
    end = new Date(); start = new Date(now - 7 * 86400000);
  } else if (preset === 'last14') {
    end = new Date(); start = new Date(now - 14 * 86400000);
  } else if (preset === 'last30') {
    end = new Date(); start = new Date(now - 30 * 86400000);
  } else if (preset === 'this_week') {
    const d = now.getDay() || 7;
    start = new Date(now); start.setDate(now.getDate() - d + 1); start.setHours(0,0,0,0);
    end = new Date();
  } else if (preset === 'last_week') {
    const d = now.getDay() || 7;
    end = new Date(now); end.setDate(now.getDate() - d); end.setHours(23,59,59,999);
    start = new Date(end); start.setDate(end.getDate() - 6); start.setHours(0,0,0,0);
  } else if (preset === 'this_month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date();
  } else if (preset === 'last_month') {
    end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59);
    start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  } else if (preset === 'custom') {
    const s = document.getElementById('period-start').value;
    const e2 = document.getElementById('period-end').value;
    if (!s || !e2) { alert('Velg fra- og til-dato'); return null; }
    start = new Date(s); end = new Date(e2); end.setHours(23,59,59,999);
  }
  return { start, end };
}

document.getElementById('submit-generator').addEventListener('click', async () => {
  const dates = getPeriodDates();
  if (!dates) return;

  const btn = document.getElementById('submit-generator');
  const status = document.getElementById('generator-status');
  btn.disabled = true;
  status.className = 'generator-status';
  status.textContent = 'Genererer rapport med AI… Dette tar 30–60 sekunder.';

  const themes = Array.from(document.getElementById('theme-filter').selectedOptions).map(o => o.value);

  try {
    const resp = await fetch('/api/reports/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        period_start: dates.start.toISOString(),
        period_end: dates.end.toISOString(),
        lang: LANG,
        title: document.getElementById('report-title').value.trim() || null,
        focus: document.getElementById('focus').value,
        themes: themes.length > 0 ? themes : null
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Generering feilet');
    window.location = `/reports/${data.id}?lang=${LANG}`;
  } catch (e) {
    status.className = 'generator-status error';
    status.textContent = 'Feil: ' + e.message;
    btn.disabled = false;
  }
});

loadReports();
</script>
</body>
</html>
